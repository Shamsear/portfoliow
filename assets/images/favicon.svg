<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Dark Charcoal to Pitch Black) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1a" />
      <stop offset="100%" stop-color="#0a0a09" />
    </linearGradient>
    <!-- Accent Gradient (Amber Gold to Cyan) -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base Circle with round corners -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1"/>

  <!-- Glowing outer hexagon -->
  <path d="M16 4 L26 9.8 L26 21.2 L16 27 L6 21.2 L6 9.8 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="2"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Monogram Dev Braces {SE} -->
  <text x="16" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="#f59e0b">{S</tspan><tspan fill="#06b6d4">E}</tspan>
  </text>
</svg>